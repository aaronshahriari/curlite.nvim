name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The oldest version curlite supports, and the current release.
        neovim: ["v0.10.4", "stable", "nightly"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Versions
        run: |
          nvim --version | head -3
          curl --version | head -1
          jq --version
          python3 --version

      # tests/run.sh starts tests/server.py for the end-to-end tests and stops
      # it on exit.
      - name: Run the suite
        run: tests/run.sh

      - name: checkhealth
        run: |
          nvim --headless --noplugin -u NONE \
            -c 'set rtp+=.' \
            -c 'lua require("curlite").setup({})' \
            -c 'checkhealth curlite' \
            -c 'w! /tmp/health.txt' -c 'qa!'
          cat /tmp/health.txt
          # A health ERROR should fail the build; WARN and INFO are fine.
          if grep -q 'ERROR' /tmp/health.txt; then
            echo "::error::checkhealth reported an error"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/
